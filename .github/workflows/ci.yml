name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (for tooling)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Ruff lint (minimal)
        shell: bash
        run: |
          set -euo pipefail
          if ! ruff check .; then
            echo "::error::Ruff checks failed. Run 'ruff check .' locally and fix reported issues."
            exit 1
          fi

      - name: Run tests (if present) or basic checks
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f tests.pl ]]; then
            echo "Detected tests.pl. Running SWI-Prolog tests..."
            if ! swipl -q -s tests.pl -g run_tests -t halt; then
              echo "::error::Prolog tests failed. Run: swipl -q -s tests.pl -g run_tests -t halt"
              exit 1
            fi
            exit 0
          fi

          echo "No tests.pl found. Running basic syntax load checks for top-level .pl files."
          shopt -s nullglob
          files=( *.pl )
          if (( ${#files[@]} == 0 )); then
            echo "No .pl files found. Nothing to validate."
            exit 0
          fi

          for f in "${files[@]}"; do
            echo "Checking $f"
            if ! swipl -q -s "$f" -g halt; then
              echo "::error::Syntax/load check failed for $f"
              exit 1
            fi
          done
